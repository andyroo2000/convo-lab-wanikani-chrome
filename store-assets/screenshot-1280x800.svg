<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#fbf5e0"/>
  <circle cx="1160" cy="60" r="210" fill="#1ab2d1" opacity="0.12"/>
  <circle cx="70" cy="760" r="230" fill="#ee685a" opacity="0.1"/>

  <g transform="translate(90 110)">
    <text x="0" y="0" fill="#ee685a" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">CONVOLAB</text>
    <text x="0" y="82" fill="#11335c" font-family="Arial, sans-serif" font-size="56" font-weight="700">Study time,</text>
    <text x="0" y="145" fill="#11335c" font-family="Arial, sans-serif" font-size="56" font-weight="700">captured automatically.</text>
    <text x="0" y="220" fill="#5d6772" font-family="Arial, sans-serif" font-size="24">Stay focused on Japanese. ConvoLab records</text>
    <text x="0" y="256" fill="#5d6772" font-family="Arial, sans-serif" font-size="24">active WaniKani and Satori Reader sessions.</text>

    <g transform="translate(0 326)">
      <circle cx="13" cy="13" r="13" fill="#1ab2d1"/>
      <path d="m7 13 4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="21" fill="#11335c" font-family="Arial, sans-serif" font-size="23" font-weight="700">Tracks only active, focused study</text>
      <circle cx="13" cy="73" r="13" fill="#1ab2d1"/>
      <path d="m7 73 4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="81" fill="#11335c" font-family="Arial, sans-serif" font-size="23" font-weight="700">Syncs completed sessions to ConvoLab</text>
      <circle cx="13" cy="133" r="13" fill="#1ab2d1"/>
      <path d="m7 133 4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="141" fill="#11335c" font-family="Arial, sans-serif" font-size="23" font-weight="700">Never reads answers or article content</text>
    </g>
  </g>

  <g transform="translate(800 78)">
    <rect x="0" y="0" width="390" height="644" rx="28" fill="#ffffff" stroke="#d8d2c3" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="56" rx="28" fill="#11335c"/>
    <path d="M0 28h390v28H0Z" fill="#11335c"/>
    <circle cx="30" cy="28" r="7" fill="#ee685a"/>
    <circle cx="54" cy="28" r="7" fill="#f4c95d"/>
    <circle cx="78" cy="28" r="7" fill="#1ab2d1"/>

    <g transform="translate(30 96)">
      <text x="0" y="0" fill="#ee685a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">CONVOLAB</text>
      <text x="0" y="45" fill="#11335c" font-family="Arial, sans-serif" font-size="31" font-weight="700">Study Tracker</text>

      <g transform="translate(0 91)">
        <circle cx="16" cy="19" r="9" fill="#2ca56c"/>
        <circle cx="16" cy="19" r="15" fill="none" stroke="#2ca56c" stroke-width="7" opacity="0.14"/>
        <text x="50" y="14" fill="#11335c" font-family="Arial, sans-serif" font-size="19" font-weight="700">Recording Satori Reader time</text>
        <text x="50" y="43" fill="#5d6772" font-family="Arial, sans-serif" font-size="16">Signed in to ConvoLab</text>
      </g>

      <text x="0" y="195" fill="#5d6772" font-family="Arial, sans-serif" font-size="16">All completed sessions are synced.</text>

      <rect x="0" y="230" width="126" height="44" rx="22" fill="#11335c"/>
      <text x="25" y="258" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Sync now</text>
      <rect x="140" y="230" width="116" height="44" rx="22" fill="#e5ebef"/>
      <text x="165" y="258" fill="#11335c" font-family="Arial, sans-serif" font-size="16" font-weight="700">Sign out</text>

      <path d="M0 320h330" stroke="#ded8c9"/>
      <text x="0" y="360" fill="#5d6772" font-family="Arial, sans-serif" font-size="15">Records activity on WaniKani review and</text>
      <text x="0" y="384" fill="#5d6772" font-family="Arial, sans-serif" font-size="15">Satori Reader article pages only. Answers</text>
      <text x="0" y="408" fill="#5d6772" font-family="Arial, sans-serif" font-size="15">and page content stay private.</text>
    </g>
  </g>
</svg>
